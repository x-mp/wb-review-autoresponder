name: Bug report
description: Report a reproducible problem without secrets or buyer personal data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach `.env`, WB/OpenRouter tokens, cookies, raw buyer data, or database dumps.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal sanitized steps and the X-Request-ID if available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true

